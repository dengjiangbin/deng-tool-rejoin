<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0e1a"><title>DENG Rejoin — Reset password</title>
<link rel="icon" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0e1a;--bg2:#070a14;--panel:#121829;--bd:rgba(255,255,255,.12);--bdlt:#f1f4fb;--hard:#04060d;
    --tx:#eef1fa;--tx2:#9aa2c0;--tx3:#616a8c;--blue:#2f6bff;--gold:#ffc531;--green:#17d39b;--red:#f5495f;
    --sans:'DM Sans',sans-serif;--head:'Bricolage Grotesque',var(--sans)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(900px 440px at 70% -10%,rgba(47,107,255,.24),transparent 60%),var(--bg);
    color:var(--tx);font-family:var(--sans);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .box{width:100%;max-width:380px}
  .top{text-align:center;margin-bottom:20px}.top img{width:60px;height:60px}
  h1{font-family:var(--head);font-weight:800;font-size:23px;margin-top:12px}
  .card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1.5px solid var(--bd);border-radius:16px;
    box-shadow:6px 6px 0 0 rgba(4,6,13,.65);padding:20px}
  label{font-family:var(--head);font-size:12px;color:var(--tx2);font-weight:700;display:block;margin:12px 0 6px}
  input{width:100%;background:var(--bg2);border:1.5px solid var(--bd);border-radius:10px;color:var(--tx);padding:11px 12px;font-family:var(--sans);font-size:14px;outline:none}
  input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,107,255,.18)}
  .btn{width:100%;margin-top:18px;font-family:var(--head);font-weight:800;font-size:15px;padding:12px;border-radius:12px;
    background:var(--gold);color:#121018;border:2px solid var(--bdlt);box-shadow:4px 4px 0 0 var(--hard);cursor:pointer}
  .btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 0 var(--hard)}
  .msg{margin-top:14px;font-size:13px;text-align:center;min-height:18px}
  .msg.err{color:var(--red)}.msg.ok{color:var(--green)}
  a{color:var(--tx2);font-size:12.5px;font-weight:600}
</style>
</head>
<body>
<div class="box">
  <div class="top"><img src="logo.svg" alt=""><h1>Set a new password</h1></div>
  <div class="card">
    <form onsubmit="return doReset(event)">
      <label>New password</label>
      <input id="p" type="password" autocomplete="new-password" placeholder="at least 6 characters">
      <label>Confirm new password</label>
      <input id="p2" type="password" autocomplete="new-password" placeholder="repeat it">
      <button class="btn" id="go" type="submit">Reset password</button>
      <div class="msg" id="msg"></div>
      <div style="text-align:center;margin-top:12px"><a href="login.html">Back to sign in</a></div>
    </form>
  </div>
</div>
<script>
  const token=new URLSearchParams(location.search).get('token');
  if(!token){document.getElementById('msg').className='msg err';document.getElementById('msg').textContent='Missing reset token. Use the link from your email.';document.getElementById('go').disabled=true}
  async function doReset(e){
    e.preventDefault();
    const p=document.getElementById('p').value,p2=document.getElementById('p2').value,msg=document.getElementById('msg');
    msg.className='msg';
    if(p.length<6){msg.className='msg err';msg.textContent='Password must be at least 6 characters.';return false}
    if(p!==p2){msg.className='msg err';msg.textContent='Passwords do not match.';return false}
    try{const r=await fetch('/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:p})});
      const d=await r.json();
      if(!r.ok){msg.className='msg err';msg.textContent=d.error||'Failed';return false}
      msg.className='msg ok';msg.textContent='Password reset. Redirecting to sign in…';
      setTimeout(()=>location.replace('login.html'),1400);
    }catch(err){msg.className='msg err';msg.textContent='Cannot reach server.'}
    return false;
  }
</script>
</body>
</html>
