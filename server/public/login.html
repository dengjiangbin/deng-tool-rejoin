<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0e1a">
<title>DENG Rejoin — Sign in</title>
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0e1a;--bg2:#070a14;--panel:#121829;--bd:rgba(255,255,255,.12);--bdlt:#f1f4fb;--hard:#04060d;
    --tx:#eef1fa;--tx2:#9aa2c0;--tx3:#616a8c;--blue:#2f6bff;--gold:#ffc531;--green:#17d39b;--red:#f5495f;
    --sans:'DM Sans',sans-serif;--head:'Bricolage Grotesque',var(--sans)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(900px 440px at 70% -10%,rgba(47,107,255,.24),transparent 60%),var(--bg);
    color:var(--tx);font-family:var(--sans);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .box{width:100%;max-width:380px}
  .top{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:22px}
  .top img{width:66px;height:66px}
  h1{font-family:var(--head);font-weight:800;font-size:25px;margin-top:14px;letter-spacing:-.3px}
  .top p{color:var(--tx3);font-size:13px;margin-top:3px}
  .card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1.5px solid var(--bd);
    border-radius:16px;box-shadow:6px 6px 0 0 rgba(4,6,13,.65);padding:20px}
  .tabs{display:flex;gap:6px;background:var(--bg2);border:1.5px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:16px}
  .tabs button{flex:1;font-family:var(--head);font-weight:700;font-size:13px;padding:9px;border:0;border-radius:9px;
    background:transparent;color:var(--tx2);cursor:pointer}
  .tabs button.on{background:var(--blue);color:#fff;box-shadow:2px 2px 0 0 var(--hard)}
  label{font-family:var(--head);font-size:12px;color:var(--tx2);font-weight:700;display:block;margin:12px 0 6px}
  input{width:100%;background:var(--bg2);border:1.5px solid var(--bd);border-radius:10px;color:var(--tx);
    padding:11px 12px;font-family:var(--sans);font-size:14px;outline:none}
  input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,107,255,.18)}
  .btn{width:100%;margin-top:18px;font-family:var(--head);font-weight:800;font-size:15px;padding:12px;border-radius:12px;
    background:var(--gold);color:#121018;border:2px solid var(--bdlt);box-shadow:4px 4px 0 0 var(--hard);cursor:pointer;transition:.12s}
  .btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 0 var(--hard)}
  .btn:disabled{opacity:.6;cursor:wait}
  .msg{margin-top:14px;font-size:13px;text-align:center;min-height:18px}
  .msg.err{color:var(--red)} .msg.ok{color:var(--green)}
  .foot{text-align:center;color:var(--tx3);font-size:12px;margin-top:18px;font-family:var(--head)}
</style>
</head>
<body>
<div class="box">
  <div class="top">
    <img src="logo.svg" alt="">
    <h1>DENG Rejoin</h1>
    <p>Fleet control for your rejoin phones</p>
  </div>
  <div class="card">
    <div class="tabs">
      <button id="tab-login" class="on" onclick="setMode('login')">Sign in</button>
      <button id="tab-reg" onclick="setMode('register')">Create account</button>
    </div>
    <form id="form" onsubmit="return submitForm(event)">
      <label>Username</label>
      <input id="u" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="username">
      <div id="emailwrap" style="display:none">
        <label>Email <span style="color:var(--tx3);font-weight:400">· for password resets</span></label>
        <input id="e" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="you@mail.com">
      </div>
      <label>Password</label>
      <input id="p" type="password" autocomplete="current-password" placeholder="••••••••">
      <button class="btn" id="go" type="submit">Sign in</button>
      <div class="msg" id="msg"></div>
      <div style="text-align:center;margin-top:12px"><a id="forgot" href="#" onclick="return forgot()" style="color:var(--tx2);font-size:12.5px;font-weight:600">Forgot password?</a></div>
    </form>
  </div>
  <div class="foot">rejoin.deng.my.id</div>
</div>
<script>
  let mode='login';
  function setMode(m){mode=m;
    document.getElementById('tab-login').classList.toggle('on',m==='login');
    document.getElementById('tab-reg').classList.toggle('on',m==='register');
    document.getElementById('go').textContent=m==='login'?'Sign in':'Create account';
    document.getElementById('p').autocomplete=m==='login'?'current-password':'new-password';
    document.getElementById('emailwrap').style.display=m==='register'?'block':'none';
    document.getElementById('forgot').parentElement.style.display=m==='login'?'block':'none';
    document.getElementById('msg').textContent='';
  }
  async function forgot(){
    const id=prompt('Enter your email or username to get a reset link:');
    if(!id)return false;
    const msg=document.getElementById('msg');
    try{const r=await fetch('/api/forgot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
      const d=await r.json();msg.className='msg ok';msg.textContent=d.message||'If that account exists, a reset link was sent.';
    }catch(e){msg.className='msg err';msg.textContent='Cannot reach server.'}
    return false;
  }
  if(localStorage.getItem('deng_token')) location.replace('index.html');
  async function submitForm(e){
    e.preventDefault();
    const u=document.getElementById('u').value.trim(), p=document.getElementById('p').value, em=document.getElementById('e').value.trim();
    const btn=document.getElementById('go'), msg=document.getElementById('msg');
    msg.className='msg'; msg.textContent='';
    if(!u||!p){msg.className='msg err';msg.textContent='Enter a username and password.';return false}
    if(mode==='register'&&!em){msg.className='msg err';msg.textContent='Enter an email for password resets.';return false}
    btn.disabled=true;
    try{
      const body=mode==='login'?{username:u,password:p}:{username:u,password:p,email:em};
      const r=await fetch('/api/'+(mode==='login'?'login':'register'),{method:'POST',
        headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const d=await r.json();
      if(!r.ok){msg.className='msg err';msg.textContent=d.error||'Failed';btn.disabled=false;return false}
      localStorage.setItem('deng_token',d.token);
      localStorage.setItem('deng_user',d.user.username);
      location.replace('index.html');
    }catch(err){msg.className='msg err';msg.textContent='Cannot reach server.';btn.disabled=false}
    return false;
  }
</script>
</body>
</html>
